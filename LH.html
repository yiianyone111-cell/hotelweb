    <div id="contact-section">
        <h2 class="text-uppercase">Liên Hệ</h2>
        <p>
            Cung cấp nhiều tiện ích và dịch vụ đi kèm, mang đến cho khách hàng những trải nghiệm tốt nhất.

    <div id="contact-box">
        <form action="process_contact.php" method="post">
            <div class="row">
                <div class="col-md-6 col-12 mb-3">
                    <label>Họ tên</label>
                    <input type="text" name="fullname" class="form-control input-small" placeholder="Nhập họ tên..." required>
                </div>
                <div class="col-md-6 col-12 mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control input-small" placeholder="Nhập email..." required>
                </div>
            </div>

            <div class="mb-3">
                <label>Chúng tôi có thể giúp gì</label>
                <input type="text" name="help" class="form-control input-small help" placeholder="Chúng tôi có thể giúp gì cho quý khách..." required>
            </div>

            <div class="mb-3">
                <label>Lời nhắn</label>
                <textarea name="message" class="message" placeholder="Lời nhắn..." required></textarea>
            </div>

            <button type="submit" class="btn-register mt-2">Gửi</button>
        </form>
