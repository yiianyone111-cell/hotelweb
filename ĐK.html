    <div id="form-box">
        <h2 class="text-center text-uppercase mb-4">Đăng Ký Tài Khoản</h2>

        <form action="process_register.php" method="post">

            <div class="row">
                <div class="col-md-6 col-12 mb-3">
                    <label>Họ tên</label>
                    <input type="text" name="fullname" class="form-control input-small" placeholder="Nhập Tên đăng nhập..." required>
                </div>

                <div class="col-md-6 col-12 mb-3">
                    <label>Số điện thoại</label>
                    <input type="text" name="phone" class="form-control input-small" placeholder="Nhập Số điện thoại..." required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 col-12 mb-3">
                    <label>Quốc tịch</label>
                    <input type="text" name="nationality" class="form-control input-small" placeholder="Nhập Quốc tịch..." required>
                </div>

                <div class="col-md-6 col-12 mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control input-small" placeholder="Nhập Email..." required>
                </div>
            </div>

            <div class="mb-3">
                <label>Mật khẩu</label>
                <input type="password" name="password" class="form-control input-small" placeholder="Nhập mật khẩu..." required>
            </div>

            <div class="mb-3">
                <label>Xác nhận mật khẩu</label>
                <input type="password" name="confirm_password" class="form-control input-small" placeholder="Nhập lại mật khẩu..." required>
            </div>

            <button type="submit" class="btn-register mt-2">Đăng ký</button>

            <p class="text-center mt-3">
                Đã có tài khoản?
                <a href="ĐN.html" style="color: yellow; font-weight:600; text-decoration:none;">
                    Đăng nhập
                </a>
            </p>

        </form>
    </div>
